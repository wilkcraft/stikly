<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", sans-serif;
      }
      body {
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        padding: 8px;
        user-select: none;
      }

      .menu-card {
        box-sizing: border-box;
        width: 190px;
        height: 212px;
        padding: 7px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 7px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
        color: #222;
      }

      .menu-section {
        padding: 3px;
      }
      .menu-title {
        font-size: 11px;
        font-weight: 600;
        opacity: 0.55;
        margin: 2px 4px 6px;
      }
      .menu-separator {
        height: 1px;
        margin: 5px 3px;
        background: rgba(0, 0, 0, 0.12);
      }

      .color-options {
        display: flex;
        gap: 8px;
        padding: 3px 4px;
      }
      .color-option {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(0, 0, 0, 0.15);
        cursor: pointer;
        box-sizing: border-box;
        transition: transform 0.1s;
      }
      .color-option:hover {
        transform: scale(1.1);
      }
      .color-option.yellow {
        background: #fff59d;
      }
      .color-option.green {
        background: #c8e6c9;
      }
      .color-option.pink {
        background: #f8bbd0;
      }
      .color-option.blue {
        background: #bbdefb;
      }
      .gear-btn {
        width: 28px;
        height: 28px;
        background: #eee;
        color: #555;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .gear-btn:hover {
        background: #ddd;
      }

      .menu-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 9px;
        border: none;
        border-radius: 5px;
        padding: 7px 8px;
        background: transparent;
        cursor: pointer;
        font-family: inherit;
        font-size: 12px;
        text-align: left;
      }
      .menu-item span {
        width: 15px;
        text-align: center;
      }
      .menu-item:hover,
      .menu-item.selected {
        background: rgba(0, 0, 0, 0.1);
      }
      .menu-item.selected {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="menu-card">
      <div class="menu-section">
        <div class="menu-title">Color</div>
        <div class="color-options">
          <button
            class="color-option yellow"
            data-color="#fff59d"
            title="Yellow"
          ></button>
          <button
            class="color-option green"
            data-color="#c8e6c9"
            title="Green"
          ></button>
          <button
            class="color-option pink"
            data-color="#f8bbd0"
            title="Pink"
          ></button>
          <button
            class="color-option blue"
            data-color="#bbdefb"
            title="Blue"
          ></button>
          <button
            id="customColorBtn"
            class="color-option gear-btn"
            title="Custom color (right-click: reset)"
          >

              viewBox="0 0 3000 3000"
              width="20"
              height="20"
              fill="currentColor"
            >

              ></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="menu-separator"></div>

      <div class="menu-section">
        <div class="menu-title">Position</div>
        <button class="menu-item" data-zorder="desktop">
          <span>▱</span>On desktop
        </button>
        <button class="menu-item" data-zorder="normal">
          <span>□</span>Normal
        </button>
        <button class="menu-item" data-zorder="top">
          <span>↑</span>Always on top
        </button>
      </div>
    </div>

    <script>
      let noteId = null;
      const zButtons = document.querySelectorAll("[data-zorder]");

      window.menuAPI.onInit(({ noteId: id, zOrder }) => {
        noteId = id;
        zButtons.forEach((b) =>
          b.classList.toggle("selected", b.dataset.zorder === zOrder),
        );
      });

      document.querySelectorAll(".color-option[data-color]").forEach((b) => {
        b.addEventListener("click", () =>
          window.menuAPI.setColor(noteId, b.dataset.color),
        );
      });

      const gear = document.getElementById("customColorBtn");
      gear.addEventListener("click", () =>
        window.menuAPI.openCustomColor(noteId),
      );
      gear.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        window.menuAPI.setColor(noteId, "#fff59d");
      });

      zButtons.forEach((b) => {
        b.addEventListener("click", () =>
          window.menuAPI.setZOrder(noteId, b.dataset.zorder),
        );
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") window.menuAPI.close(noteId);
      });
    </script>
  </body>
</html>
