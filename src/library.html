<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <title>Stikly – My notes</title>
    <link rel="stylesheet" href="library.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img src="../build/icon.png" alt="" class="brand-badge" />
          Stikly
        </div>
        <button type="button" id="updateBtn" class="update-btn" hidden>
          ⬆ New version available
        </button>
        <div class="topbar-right">
          <div class="theme-switch" role="group" aria-label="Theme">
            <button
              type="button"
              data-pref="system"
              title="Auto (follows Windows)"
            >
              Auto
            </button>
            <button type="button" data-pref="light" title="Light">☀</button>
            <button type="button" data-pref="dark" title="Dark">☾</button>
          </div>
          <button
            type="button"
            id="settingsBtn"
            class="icon-pill"
            title="Settings"
          >
            &#9881;
          </button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="hero">
        <div class="hero-eyebrow">Your notice board</div>
        <h1>My notes</h1>
        <p class="lede" id="countLabel">&nbsp;</p>

        <div class="hero-actions">
          <button type="button" id="newBtn" class="paper-btn primary">
            + New note
          </button>
          <button type="button" id="importBtn" class="paper-btn secondary">
            Import…
          </button>
          <button type="button" id="folderBtn" class="paper-btn secondary">
            Open folder
          </button>
        </div>

        <input
          type="search"
          id="searchInput"
          class="search"
          placeholder="Search your notes…"
          spellcheck="false"
        />

        <div class="filters">
          <label class="chk">
            <input type="checkbox" id="deepSearch" /> Search inside notes
          </label>
          <select id="sortSelect" aria-label="Sort by">
            <option value="recent">Sort: Recent</option>
            <option value="name">Sort: Name</option>
            <option value="color">Sort: Color</option>
          </select>
          <div class="theme-switch" role="group" aria-label="View">
            <button type="button" data-view="board" aria-pressed="true">
              Board
            </button>
            <button type="button" data-view="list" aria-pressed="false">
              List
            </button>
          </div>
        </div>
        <div
          id="colorFilter"
          class="color-filter"
          aria-label="Filter by color"
          hidden
        ></div>
        <div
          id="tagFilter"
          class="tag-filter"
          aria-label="Filter by tag"
          hidden
        ></div>
      </section>

      <section id="board" class="board" aria-label="Saved notes"></section>
      <p id="emptyState" class="empty"></p>
      <p class="hint">
        Click a note to open it · Shift + click to open it without closing this
        panel
      </p>
      <label class="update-opt">
        <input type="checkbox" id="updateOpt" /> Notify me about new versions
      </label>
    </main>

    <div id="updateModal" class="modal" hidden>
      <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="updateTitle"
      >
        <h2 id="updateTitle"></h2>
        <div id="updateBody" class="md"></div>
        <div class="modal-actions">
          <button type="button" id="updateClose" class="paper-btn secondary">
            Later
          </button>
          <button type="button" id="updateDownload" class="paper-btn primary">
            Download…
          </button>
        </div>
      </div>
    </div>

    <div id="downloadModal" class="modal" hidden>
      <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dlTitle"
      >
        <h2 id="dlTitle"></h2>

        <div class="dl-row" data-kind="setup">
          <div class="dl-top">
            <div class="dl-info">
              <strong>Installer</strong>
              <span class="dl-name"></span>
            </div>
            <button type="button" class="paper-btn primary dl-btn">
              Download
            </button>
          </div>
          <div class="dl-progress" hidden>
            <progress max="100" value="0"></progress>
            <span class="dl-pct"></span>
          </div>
          <div class="dl-msg"></div>
        </div>

        <div class="dl-row" data-kind="portable">
          <div class="dl-top">
            <div class="dl-info">
              <strong>Portable</strong>
              <span class="dl-name"></span>
            </div>
            <button type="button" class="paper-btn primary dl-btn">
              Download
            </button>
          </div>
          <div class="dl-progress" hidden>
            <progress max="100" value="0"></progress>
            <span class="dl-pct"></span>
          </div>
          <div class="dl-msg"></div>
        </div>

        <div class="modal-actions">
          <button type="button" id="dlClose" class="paper-btn secondary">
            Close
          </button>
        </div>
      </div>
    </div>

    <div id="settingsModal" class="modal" hidden>
      <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settingsTitle"
      >
        <h2 id="settingsTitle">Settings</h2>

        <label class="set-row">
          <input type="checkbox" id="setLogin" /> Start Stikly with Windows
        </label>

        <fieldset class="set-group">
          <legend>When Stikly starts, open…</legend>
          <label
            ><input type="radio" name="startupMode" value="panel" /> The
            &ldquo;My notes&rdquo; panel</label
          >
          <label
            ><input type="radio" name="startupMode" value="restore" /> The notes
            I had open</label
          >
          <label
            ><input type="radio" name="startupMode" value="selected" /> Only the
            notes marked &#128640; (mark them in the panel)</label
          >
        </fieldset>

        <label class="set-row">
          <input type="checkbox" id="setShortcutOn" /> Global shortcut for a new
          note
        </label>
        <input
          type="text"
          id="setShortcut"
          readonly
          placeholder="Click and press a combination"
        />
        <p id="shortcutMsg" class="hint"></p>

        <div class="modal-actions">
          <button type="button" id="settingsClose" class="paper-btn primary">
            Close
          </button>
        </div>
      </div>
    </div>

    <script src="library.js"></script>
  </body>
</html>
