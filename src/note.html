<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Stikly Note</title>
    <link rel="stylesheet" href="note.css" />
  </head>

  <body>
    <div class="note" id="note">
      <div class="top-dock">
        <div class="titlebar" id="titlebar">
          <div class="left-actions">
            <button id="menuBtn" class="icon-btn" title="Options">⋮</button>
            <button id="saveBtn" class="icon-btn" title="Save note">
              <svg
                viewBox="0 0 24 24"
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"
                />
                <path d="M17 21v-8H7v8" />
                <path d="M7 3v5h8" />
              </svg>
            </button>
          </div>

          <div class="actions">
            <div class="new-note-group">
              <button id="newBtn" title="New note">+</button>
              <button id="openBtn" title="Open existing note">
                <svg
                  viewBox="0 0 24 24"
                  width="9"
                  height="9"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M6 9l6 6 6-6" />
                </svg>
              </button>
            </div>
            <button id="closeBtn" title="Close">×</button>
          </div>
        </div>

        <button id="toggleTopBtn" class="collapse-btn" title="Hide top bar">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 15l6-6 6 6" />
          </svg>
        </button>
      </div>

      <div
        id="content"
        class="content"
        contenteditable="true"
        spellcheck="false"
        data-placeholder="Write something..."
      ></div>

      <div class="bottom-dock">
        <button
          id="toggleBottomBtn"
          class="collapse-btn"
          title="Hide bottom bar"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 15l6-6 6 6" />
          </svg>
        </button>

        <div class="toolbar">
          <button data-command="bold" title="Bold">
            <b>B</b>
          </button>

          <button data-command="italic" title="Italic">
            <i>I</i>
          </button>

          <button data-command="underline" title="Underline">
            <u>U</u>
          </button>

          <button data-command="strikeThrough" title="Strikethrough">
            <s>S</s>
          </button>

          <span class="toolbar-separator"></span>
          <button id="colorBtn" title="Text color">A</button>
          <button
            id="highlightBtn"
            title="Highlight color (right-click to remove)"
          >
            <svg
              viewBox="0 0 24 24"
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m9 11-6 6v3h9l3-3" />
              <path
                d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"
              />
            </svg>
          </button>

          <button data-command="insertUnorderedList" title="Bulleted list">
            <span class="list-icon">•</span><span class="list-lines">☰</span>
          </button>

          <button data-command="insertOrderedList" title="Numbered list">
            <span class="number-icon">1.</span
            ><span class="list-lines">☰</span>
          </button>
          <button id="checklistBtn" title="Checklist">
            <svg
              viewBox="0 0 24 24"
              width="15"
              height="15"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <path d="m8 12 3 3 5-6" />
            </svg>
          </button>
          <button data-command="undo" title="Undo">↶</button>
          <button data-command="redo" title="Redo">↷</button>
        </div>

        <div id="searchBar" class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Search..."
            spellcheck="false"
          />
          <button id="searchCloseBtn" title="Close search">×</button>
        </div>
      </div>

      <div id="colorMenu" class="menu color-menu">
        <button id="resetColorBtn" class="menu-item">
          <span>⟲</span>
          Reset color
        </button>
      </div>
      <div id="highlightMenu" class="menu color-menu">
        <button id="resetHighlightBtn" class="menu-item">
          <span>⟲</span>
          Remove highlight
        </button>
      </div>
    </div>

    <script src="note.js"></script>
  </body>
</html>
