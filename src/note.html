<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sticky Note</title>
    <link rel="stylesheet" href="note.css" />
  </head>

  <body>
    <div class="note" id="note">
      <div class="titlebar" id="titlebar">
        <div class="left-actions">
          <button id="menuBtn" class="icon-btn" title="Options">
            ⋮
          </button>

          <div id="menu" class="menu">
            <div class="menu-section">
              <div class="menu-title">Color</div>

              <div class="color-options">
                <button
                  class="color-option yellow"
                  data-color="#fff59d"
                  title="Yellow"
                ></button>
                <button
                  class="color-option green"
                  data-color="#c8e6c9"
                  title="Green"
                ></button>
                <button
                  class="color-option pink"
                  data-color="#f8bbd0"
                  title="Pink"
                ></button>
                <button
                  class="color-option blue"
                  data-color="#bbdefb"
                  title="Blue"
                ></button>
                <button
                  id="customColorBtn"
                  class="color-option gear-btn"
                  title="Custom color"
                >

                    viewBox="0 0 3000 3000"
                    width="20"
                    height="20"
                    fill="currentColor"
                  >

                    ></path>
                  </svg>
                </button>
                <input
                  type="color"
                  id="noteColorPicker"
                  value="#fff59d"
                  style="display: none"
                />
              </div>
            </div>

            <div class="menu-separator"></div>

            <div class="menu-section">
              <div class="menu-title">Position</div>

              <button class="menu-item" data-zorder="desktop">
                <span>▱</span>
                On desktop
              </button>

              <button class="menu-item" data-zorder="normal">
                <span>□</span>
                Normal
              </button>

              <button class="menu-item" data-zorder="top">
                <span>↑</span>
                Always on top
              </button>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="newBtn" title="New note">+</button>
          <button id="closeBtn" title="Close">×</button>
        </div>
      </div>

      <div
        id="content"
        class="content"
        contenteditable="true"
        spellcheck="false"
        data-placeholder="Write something..."
      ></div>

      <div class="toolbar">
        <button data-command="bold" title="Bold">
          <b>B</b>
        </button>

        <button data-command="italic" title="Italic">
          <i>I</i>
        </button>

        <button data-command="underline" title="Underline">
          <u>U</u>
        </button>

        <button data-command="strikeThrough" title="Strikethrough">
          <s>S</s>
        </button>

        <span class="toolbar-separator"></span>
        <button id="colorBtn" title="Text color">A</button>
        <input
          type="color"
          id="colorPicker"
          value="#000000"
          style="display: none"
        />

        <button data-command="insertUnorderedList" title="Bulleted list">
          <span class="list-icon">•</span><span class="list-lines">☰</span>
        </button>

        <button data-command="insertOrderedList" title="Numbered list">
          <span class="number-icon">1.</span><span class="list-lines">☰</span>
        </button>
      </div>
      <div id="colorMenu" class="menu color-menu">
        <button id="resetColorBtn" class="menu-item">
          <span>⟲</span>
          Reset color
        </button>
      </div>
      <div id="noteColorMenu" class="menu">
        <button id="resetNoteColorBtn" class="menu-item">
          <span>⟲</span>
          Reset color
        </button>
      </div>
    </div>

    <script src="note.js"></script>
  </body>
</html>
